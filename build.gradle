import net.ornithemc.ploceus.api.PloceusGradleExtensionApi

plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.19-SNAPSHOT'
	id 'ploceus' version '1.17.4'
}

base {
	archivesName = project.archives_base_name
}
version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

repositories {
	google()
	maven { url = 'https://maven.cloverclient.com/releases' }
	maven { url = 'https://repo.polyfrost.org/releases' }
	maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "pl.tomgirl:pylon:0.2.9"
	modImplementation "org.polyfrost.oneconfig:1.8.9-ornithe:1.9.3"
	modImplementation "net.fabricmc:fabric-language-kotlin:1.14.1+kotlin.2.4.20"
	// The 1.8.9 build of 3.0.6 is missing a class used by the overlay renderer.
	modImplementation "org.polyfrost:polycompose-1.8.9-ornithe:3.0.5"
	modImplementation "org.lwjgl:lwjgl:3.4.3"
	modImplementation "org.lwjgl:lwjgl-sdl:3.4.3"
	modImplementation "org.lwjgl:lwjgl-opengl:3.4.3"
	modImplementation "org.lwjgl:lwjgl-openal:3.4.3"

	mappings(ploceus.layeredMappings {
		mappings("net.ornithemc:feather-gen2:${project.minecraft_version}+build.${project.feather_build}:v2") {
			containsUnpick()
		}
	})

	ploceus.dependOsl(project.osl_version)
}

def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nativePlatform = hostOs.contains('win') ? (hostArch.contains('aarch64') ? 'natives-windows-arm64' : 'natives-windows') : (hostOs.contains('mac') ? (hostArch.contains('aarch64') ? 'natives-macos-arm64' : 'natives-macos') : 'natives-linux')
dependencies {
	for (module in ['lwjgl', 'lwjgl-sdl', 'lwjgl-opengl', 'lwjgl-openal']) {
		runtimeOnly "org.lwjgl:${module}:3.4.3:${nativePlatform}"
	}
}

configurations.configureEach {
	exclude(group: 'org.lwjgl.lwjgl')
}

extensions.getByType(PloceusGradleExtensionApi).setIntermediaryGeneration(2)

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
	it.options.compilerArgs.add('-Xlint:-options')
}

java {
	// Still required by IDEs such as Eclipse and Visual Studio Code
	// OneConfig 1.8.x targets Java 21, so the client must run on Java 21 or later.
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
	// Uncomment this line to generate them.
	// withJavadocJar()
}

// If you plan to use a different file for the license, don't forget to change the file name here!
jar {
	from('LICENSE') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// Configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
